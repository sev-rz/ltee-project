# Reproduce from a clean clone: does `pixi run reproduce` work on a machine
# that has never seen this project? GitHub gives us a fresh Linux machine and
# a fresh clone of the repository on every run.
#
# From the CBIO7501 project template (MIT). Copy it into any project that has
# a pixi.toml with a `reproduce` task.
name: Reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fresh clone
        uses: actions/checkout@v7

      - name: Install Pixi and the locked environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true   # fail if pixi.lock does not match pixi.toml

      - name: Check the citation file
        run: pixi exec cffconvert --validate -i CITATION.cff

      - name: Rebuild every result from raw data
        run: pixi run reproduce

      - name: Committed files must not change when the analysis runs
        run: git status --porcelain && git diff --exit-code

      - name: Keep the results for 7 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            results/
            reports/*.html
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fresh clone
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f containers/Dockerfile --build-arg ENV_NAME=pipeline -t ltee-project:0.1.0 .

      - name: Download the data
        run: docker run --rm -v "$PWD":/work -w /work ltee-project:0.1.0 python scripts/download_data.py

      - name: Run variant calling
        run: docker run --rm -v "$PWD":/work -w /work ltee-project:0.1.0 bash scripts/run_variant_calling.sh

      - name: Check the variant counts
        run: |
          for s in SRR2584863:25 SRR2584866:775 SRR2589044:10; do
            n=$(grep -vc '^#' "results/vcf/${s%%:*}_final_variants.vcf")
            echo "${s%%:*} $n"
            test "$n" = "${s##*:}"
          done
